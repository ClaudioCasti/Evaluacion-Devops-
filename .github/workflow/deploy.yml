name: Deploy Innovatech a AWS EC2

on:
  push:
    branches:
      - deploy              # solo se activa en esta rama

jobs:
  build-and-push:
    name: Build y Push imágenes Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest

      - name: Build y Push Backend Despachos
        uses: docker/build-push-action@v5
        with:
          context: ./backend-despachos
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-despachos:latest

      - name: Build y Push Backend Ventas
        uses: docker/build-push-action@v5
        with:
          context: ./backend-ventas
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-ventas:latest

  deploy-to-ec2:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: build-and-push       # espera que el build termine

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar docker-compose a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,init.sql"
          target: "/home/ubuntu/app"

      - name: Deploy con docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            # Login a Docker Hub desde EC2
            echo "${{ secrets.DOCKER_PASSWORD }}" |               docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Bajar imágenes nuevas y reiniciar
            export MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
            docker compose pull
            docker compose up -d --remove-orphans

            # Limpiar imágenes antiguas
            docker image prune -f