server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — redirigir todo a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend de despachos
    location /api/despachos/ {
        proxy_pass http://backend-despachos:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy al backend de ventas
    location /api/ventas/ {
        proxy_pass http://backend-ventas:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}